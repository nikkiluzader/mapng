# MapNG desktop packaging. Run scripts/stage.mjs for the target platform
# first (the export runner + Node runtime) and npm run build at the repo root
# (the page): both ride outside the asar, where a separate Node can read them.
#
# Releases: .github/workflows/desktop-release.yml builds both platforms on a
# version tag (v0.1.0 = desktop/package.json's version) and publishes them to
# a draft GitHub Release, with the latest*.yml files the updater reads.
appId: com.mapng.desktop
productName: MapNG
copyright: Copyright © Nikki Luzader
directories:
  output: release
  buildResources: assets
icon: assets/icon.png
# (every module main.js imports: a missing one crashes the packaged app at
# start, where development runs from the folder and never notices)
files:
  - main.js
  - preload.cjs
  - modsFolder.js
  - updater.js
  - levelLibrary.js
  - crashReports.js
  - installCheck.js
  - reportScrub.js
  - package.json
extraResources:
  - from: ../dist
    to: dist
  - from: build/runner
    to: runner
  # (its node_modules on their own: a folder's node_modules is left out)
  - from: build/runner/node_modules
    to: runner/node_modules
  - from: build/node
    to: node
publish:
  provider: github
  owner: nikkiluzader
  repo: mapng
  releaseType: draft
win:
  target:
    - target: nsis
      arch: [x64]
    # (the app as a plain folder in a zip, for people the installer fails
    # for: unzip anywhere and run MapNG.exe. No installer, no uninstaller,
    # and it does not update itself: updater.js tells it apart by the
    # missing uninstaller and points at the download instead)
    - target: zip
      arch: [x64]
  # (unsigned for now: Windows SmartScreen warns on first run. On Linux,
  # editing the exe's icon and version needs wine: pass
  # -c.win.signAndEditExecutable=false there, as pack:win does)
  artifactName: MapNG-${version}-windows-portable.${ext}
nsis:
  # (the installer's own name: latest.yml, which the updater reads, names it)
  artifactName: MapNG-Setup-${version}.${ext}
  # The first page asks who to install for. "Only for me" (the default) needs
  # no admin rights and goes under the user's own folders; "Anyone who uses
  # this computer" asks for administrator rights and can then write to any
  # folder. Per user only, a folder the user could not write to (one of
  # their own choice on C:) failed at the uninstaller with "Error opening
  # file for writing" and no way forward (tester report, 0.2.16).
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: MapNG
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  artifactName: MapNG-${version}-x86_64.${ext}
