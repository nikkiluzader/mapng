# MapNG desktop: on a version tag (v0.1.0, matching desktop/package.json),
# build the Windows installer, the Windows portable zip and the Linux AppImage and attach them to a
# draft GitHub Release (with the latest*.yml files the app's updater reads).
# Publish the draft by hand once it is checked: users are offered it then.
#
# A test build is a tag with a suffix (v0.3.1-dev.4). It is built the same way and then published by this
# workflow as a GitHub pre-release: never "Latest", so only installs with Help > Get Test Builds are offered it.
name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# (each job asks for what it needs: nothing may write by default)
permissions:
  contents: read

jobs:
  build:
    # The signing secrets belong to the "release" environment, which only v* tags may use (and only an
    # admin may push a v* tag: the "Release tags: admins only" ruleset). A manual run, from any branch,
    # gets the "manual-build" environment, which holds no secrets: it builds unsigned files to try.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'manual-build' }}
    permissions:
      contents: write
      # (build provenance: GitHub signs a statement that these files were built by this workflow from this commit)
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            builder: --win
          - os: ubuntu-latest
            platform: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      # (the job's token is not left in the checkout for the installs and builds below to find: the steps
      # that upload are handed it by name)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./desktop/package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != desktop/package.json $want"; exit 1; }

      - name: Build the page
        run: |
          npm ci
          npm run build

      - name: Stage the export runner and Node
        working-directory: desktop
        run: |
          npm ci
          node scripts/stage.mjs --platform ${{ matrix.platform }} --arch x64

      # Windows code signing (Azure Artifact Signing, account "mapng", East US, a Public Trust profile): on as soon
      # as the three AZURE_* repository secrets exist, and from then on every Windows build is signed. The app's
      # updater checks an update's publisher against the one its own build was signed with, so a release must
      # never go out unsigned after a signed one: the step after this fails the build if a file is not signed.
      - name: Package and publish
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # (only the Windows build of a tag signs: the Linux build and a manual run never see these)
          AZURE_TENANT_ID: ${{ matrix.platform == 'win32' && startsWith(github.ref, 'refs/tags/') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win32' && startsWith(github.ref, 'refs/tags/') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win32' && startsWith(github.ref, 'refs/tags/') && secrets.AZURE_CLIENT_SECRET || '' }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        # (a manual run builds without publishing: artifacts below)
        run: |
          sign=()
          # (a tag's Windows build is signed or it is not built: an unsigned installer must never reach a release)
          if [ "${{ matrix.platform }}" = "win32" ] && [ "$IS_TAG" = "true" ] && { [ -z "$AZURE_CLIENT_ID" ] || [ -z "$SIGNING_PROFILE" ]; }; then
            echo "::error::Windows code signing is off (no AZURE_CLIENT_ID secret in the release environment, or no WINDOWS_SIGNING_PROFILE variable): a release is not built unsigned"
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "win32" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$SIGNING_PROFILE" ]; then
            echo "Windows code signing: on (profile $SIGNING_PROFILE)"
            sign=(
              "-c.win.azureSignOptions.publisherName=Nikki Luzader"
              "-c.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net"
              "-c.win.azureSignOptions.codeSigningAccountName=mapng"
              "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"
            )
          else
            echo "Windows code signing: off (a manual run, or not the Windows build)"
          fi
          npx electron-builder ${{ matrix.builder }} --x64 "${sign[@]}" --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Check the Windows signatures
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          SIGNING_ON: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $files = @(Get-ChildItem desktop/release/*.exe) + @(Get-Item desktop/release/win-unpacked/MapNG.exe)
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($env:SIGNING_ON -eq 'true' -and $s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) are not validly signed although signing is on" }

      # Anyone can check a download against what was built here: the SHA-256 of every file is attached to the
      # release, and GitHub's build provenance says which commit and workflow run produced it
      # (gh attestation verify <file> --repo nikkiluzader/mapng). Neither may hold a release back: a failure
      # here is reported and the build goes on.
      - name: Checksums
        id: checksums
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          sha256sum *.exe *.zip *.AppImage > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"
          gh release upload "${GITHUB_REF_NAME}" "SHA256SUMS-${{ matrix.platform }}.txt" --clobber

      - name: Build provenance
        id: provenance
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage

      # (neither holds the release back, so a failure is said where it is seen: on the run's own page)
      - name: Say so when the checksums or the provenance failed
        if: startsWith(github.ref, 'refs/tags/') && (steps.checksums.outcome == 'failure' || steps.provenance.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning::${{ matrix.platform }}: checksums ${{ steps.checksums.outcome }}, build provenance ${{ steps.provenance.outcome }}"
          echo "### ${{ matrix.platform }}: checksums ${{ steps.checksums.outcome }}, build provenance ${{ steps.provenance.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The release's files are attached, but this check of them is missing. Run the job again, or attach it by hand, before publishing." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapng-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/latest*.yml
          if-no-files-found: error

  # The app takes an update only when the release's latest*.yml carries MapNG's signature
  # (desktop/updateSignature.js). Signed here, in a job of its own that installs nothing and builds nothing:
  # the key never shares a machine with the packages the build installs. It takes the two lists the builds
  # attached to the draft release, signs them, and attaches the signatures. Without the key it fails, before
  # anyone could be offered a release their install would refuse (a release stays a draft, and a test build
  # is published only after this job).
  sign-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            desktop/scripts/signManifest.mjs
            desktop/updateSignature.js
          sparse-checkout-cone-mode: false
      - name: Sign the update manifests
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir manifests
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir manifests --pattern 'latest.yml' --pattern 'latest-linux.yml'
          ls -l manifests
          [ -f manifests/latest.yml ] && [ -f manifests/latest-linux.yml ] || { echo "::error::the release does not hold both latest.yml and latest-linux.yml"; exit 1; }
          node desktop/scripts/signManifest.mjs manifests/latest.yml manifests/latest-linux.yml
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" manifests/latest.yml.sig manifests/latest-linux.yml.sig --clobber

  # A test build (a tag like v0.3.1-dev.4): once both platforms are attached, the draft becomes a pre-release.
  publish-test-build:
    needs: [build, sign-manifest]
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Test build from the dev branch. It may be unstable: for testers who turned on Help > Get Test Builds."
            echo
            if [ -n "$prev" ]; then
              echo "Changes since ${prev}:"
              echo
              git log --no-merges --pretty='- %s' "${prev}..${GITHUB_REF_NAME}" | head -n 60
            fi
          } > notes.md
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false --title "MapNG ${GITHUB_REF_NAME#v} (test build)" --notes-file notes.md
