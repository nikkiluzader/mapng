# MapNG desktop: on a version tag (v0.1.0, matching desktop/package.json),
# build the Windows installer, the Windows portable zip and the Linux AppImage and attach them to a
# draft GitHub Release (with the latest*.yml files the app's updater reads).
# Publish the draft by hand once it is checked: users are offered it then.
#
# A test build is a tag with a suffix (v0.3.1-dev.4). It is built the same way and then published by this
# workflow as a GitHub pre-release: never "Latest", so only installs with Help > Get Test Builds are offered it.
name: Desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  # (build provenance: GitHub signs a statement that these files were built by this workflow from this commit)
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            builder: --win
          - os: ubuntu-latest
            platform: linux
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./desktop/package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != desktop/package.json $want"; exit 1; }

      - name: Build the page
        run: |
          npm ci
          npm run build

      - name: Stage the export runner and Node
        working-directory: desktop
        run: |
          npm ci
          node scripts/stage.mjs --platform ${{ matrix.platform }} --arch x64

      - name: Package and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # (a manual run builds without publishing: artifacts below)
        run: npx electron-builder ${{ matrix.builder }} --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      # The app takes an update only when the release's latest*.yml carries MapNG's signature
      # (desktop/updateSignature.js). The key is a repository secret; without it the build fails
      # here, before anyone could be offered a release their install would refuse.
      - name: Sign the update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node desktop/scripts/signManifest.mjs desktop/release/latest*.yml
          gh release upload "${GITHUB_REF_NAME}" desktop/release/latest*.yml.sig --clobber

      # Anyone can check a download against what was built here: the SHA-256 of every file is attached to the
      # release, and GitHub's build provenance says which commit and workflow run produced it
      # (gh attestation verify <file> --repo nikkiluzader/mapng). Neither may hold a release back: a failure
      # here is reported and the build goes on.
      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          sha256sum *.exe *.zip *.AppImage > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"
          gh release upload "${GITHUB_REF_NAME}" "SHA256SUMS-${{ matrix.platform }}.txt" --clobber

      - name: Build provenance
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mapng-${{ matrix.platform }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/latest*.yml
            desktop/release/latest*.yml.sig
          if-no-files-found: error

  # A test build (a tag like v0.3.1-dev.4): once both platforms are attached, the draft becomes a pre-release.
  publish-test-build:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "Test build from the dev branch. It may be unstable: for testers who turned on Help > Get Test Builds."
            echo
            if [ -n "$prev" ]; then
              echo "Changes since ${prev}:"
              echo
              git log --no-merges --pretty='- %s' "${prev}..${GITHUB_REF_NAME}" | head -n 60
            fi
          } > notes.md
          gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false --title "MapNG ${GITHUB_REF_NAME#v} (test build)" --notes-file notes.md
