      <div style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: system-ui, sans-serif; color: #333;">
        <h1>MapNG: Real-World Maps for BeamNG.drive</h1>
        <p>MapNG is a free, open-source map generator that turns any real-world location into a playable BeamNG.drive level, built from real elevation and OpenStreetMap data. It runs in your browser with no account, or as a desktop app for Windows and Linux.</p>
        <h2>Features</h2>
        <ul>
          <li>A playable BeamNG.drive level from any place on Earth, up to 16384 x 16384</li>
          <li>Elevation: Standard 30 m global, USGS 1 m (USA), KRON86 (Poland), GPXZ with your own key, or your own LAZ/LAS, GeoTIFF, ASC and GML files</li>
          <li>Terrain materials from OpenStreetMap land use, satellite or game-style ground textures</li>
          <li>Textured buildings, regional trees, grass and rocks chosen from the location</li>
          <li>Roads with real surfaces and lane markings by country, crosswalks, stop bars, parking lanes, traffic signals, road signs and street lamps</li>
          <li>Raised sidewalks with curbs and ramps, median islands, hydrants, benches, utility poles and power lines</li>
          <li>Bridges, overpasses and tunnels; AI traffic and road names on the minimap</li>
          <li>Racetracks, sports grounds, swimming pools and fountains</li>
          <li>GeoTIFF, GeoJSON, GLB and DAE exports, an interactive 3D preview, and shareable codes for your settings</li>
          <li>Batch mode for tile grids, and a combined BeamNG level stitched from a 2x2, 4x4 or 8x8 grid</li>
        </ul>
        <h2>How to make a BeamNG map from a real-world location</h2>
        <p>Select a location on the map or search by name, choose an output size (512 to 16384 px) and an elevation source, and generate. Check the terrain in the 3D preview, then export the BeamNG level and put the ZIP in your BeamNG.drive mods folder.</p>
        <h2>MapNG Desktop for Windows and Linux</h2>
        <p>The free desktop app runs MapNG on your own computer: no browser memory limit, every CPU core, levels saved straight into BeamNG.drive's mods folder, and a list of your MapNG levels you can Update or Modify without downloading the data again. <a href="https://github.com/nikkiluzader/mapng/releases/latest">Download MapNG Desktop</a>.</p>
        <p><strong>Please enable JavaScript to use MapNG.</strong></p>
        <p><a href="https://github.com/nikkiluzader/mapng">View on GitHub</a> · <a href="https://mapng.com/data.html">Your data</a></p>
